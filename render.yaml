services:
  - type: web
    name: real-world-map
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    preDeployCommand: npm --prefix backend run prisma:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: real-world-map-db
          property: connectionString
      - key: MAPTILER_API_KEY
        sync: false
      - key: VIP_CODE
        sync: false
      - key: PORT
        value: 10000

databases:
  - name: real-world-map-db
    plan: free
    region: singapore
